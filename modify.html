<!DOCTYPE html>
<html><head><title>Gmail API Modify</title>
<style>
body { font-family: monospace; max-width: 900px; margin: 40px auto; padding: 0 20px; }
input, select { margin: 5px 0 15px; padding: 8px; box-sizing: border-box; }
input[type=password], input[type=text] { width: 100%; }
button { padding: 8px 18px; font-size: 14px; cursor: pointer; margin: 2px; }
#result { margin-top: 20px; padding: 15px; border: 1px solid #ccc; white-space: pre-wrap; word-break: break-all; }
.success { background: #e8f5e9; }
.error { background: #ffebee; }
table { border-collapse: collapse; width: 100%; }
td, th { border: 1px solid #ccc; padding: 6px; text-align: left; font-size: 13px; }
</style></head><body>
<h1>Gmail API Modify</h1>
<p>File, archive, or trash mail via the Gmail API. Token must carry the gmail.modify scope. No message bodies are shown or sent anywhere — only IDs, subjects, and senders.</p>
<label>Access Token:</label>
<input type="password" id="token" placeholder="ya29..." autocomplete="off">
<button onclick="loadStoredToken()">Use stored browser token (refresh)</button>
<button onclick="listInbox()">List Inbox (headers only)</button>
<button onclick="listTrash()">List Trash (headers only)</button>
<button onclick="testProfile()">Test Token (Profile)</button>
<div id="list"></div>
<h2>Act on one message by ID</h2>
<label>Message ID:</label>
<input type="text" id="msgId" placeholder="e.g. 1a1883faada9e5e8">
<label>File under label:</label>
<select id="labelId">
  <option value="Label_1">PDC/Buyer Correspondence (Label_1)</option>
  <option value="Label_2">PDC/Marketplace (Label_2)</option>
  <option value="Label_3">PDC/Security (Label_3)</option>
  <option value="Label_4">PDC/Dynadot (Label_4)</option>
</select>
<button onclick="fileMsg()">File + Archive</button>
<button onclick="archiveMsg()">Archive only</button>
<button onclick="trashMsg()">Trash</button>
<button onclick="untrashMsg()">Restore from Trash</button>
<div id="result">Ready.</div>
<script>
const API = 'https://gmail.googleapis.com/gmail/v1/users/me';
function tok() { return document.getElementById('token').value.trim(); }
function show(el, text, ok) { el.textContent = text; el.className = ok ? 'success' : 'error'; }
async function api(path, method, body) {
  const r = await fetch(API + path, {
    method: method || 'GET',
    headers: { 'Authorization': 'Bearer ' + tok(), 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  const j = await r.json().catch(() => ({}));
  return { status: r.status, ok: r.ok, j };
}
async function loadStoredToken() {
  const el = document.getElementById('result');
  const refresh = localStorage.getItem('pdc_gmail_modify_refresh');
  const creds = localStorage.getItem('pdc_gmail_modify_client');
  if (!refresh || !creds) { show(el, 'No stored modify token in this browser profile. Mint one on the callback page first.', false); return; }
  const { client_id, client_secret } = JSON.parse(creds);
  el.textContent = 'Refreshing access token...'; el.className = '';
  try {
    const body = new URLSearchParams({ refresh_token: refresh, client_id: client_id, client_secret: client_secret, grant_type: 'refresh_token' });
    const r = await fetch('https://accounts.google.com/o/oauth2/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString() });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.access_token) { show(el, 'Token refresh failed. HTTP ' + r.status + '. Error: ' + (j.error || 'no access token'), false); return; }
    document.getElementById('token').value = j.access_token;
    show(el, 'Access token loaded from stored refresh token. Expires in ' + j.expires_in + ' seconds. Token value is not displayed.', true);
  } catch (e) {
    show(el, 'Token refresh request failed: ' + e.message, false);
  }
}
async function testProfile() {
  const el = document.getElementById('result');
  if (!tok()) { show(el, 'Need a token.', false); return; }
  const { status, ok, j } = await api('/profile');
  show(el, 'HTTP ' + status + '\n' + JSON.stringify(j, null, 2), ok);
}
async function listInbox() {
  const el = document.getElementById('result');
  const listEl = document.getElementById('list');
  if (!tok()) { show(el, 'Need a token.', false); return; }
  el.textContent = 'Listing inbox...'; el.className = '';
  const { status, ok, j } = await api('/messages?q=' + encodeURIComponent('in:inbox') + '&maxResults=50');
  if (!ok) { show(el, 'HTTP ' + status + '\n' + JSON.stringify(j, null, 2), false); return; }
  const msgs = j.messages || [];
  let rows = '<table><tr><th>ID</th><th>Date</th><th>From</th><th>Subject</th><th>Labels</th></tr>';
  for (const m of msgs) {
    const g = await api('/messages/' + m.id + '?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date');
    const h = {};
    (g.j.payload && g.j.payload.headers || []).forEach(x => h[x.name] = x.value);
    const esc = s => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    rows += '<tr><td>' + m.id + '</td><td>' + esc(h.Date) + '</td><td>' + esc(h.From) + '</td><td>' + esc(h.Subject) + '</td><td>' + (g.j.labelIds || []).join(', ') + '</td></tr>';
  }
  rows += '</table>';
  listEl.innerHTML = rows;
  show(el, 'Inbox: ' + msgs.length + ' messages listed (headers only).', true);
}
async function listTrash() {
  const el = document.getElementById('result');
  const listEl = document.getElementById('list');
  if (!tok()) { show(el, 'Need a token.', false); return; }
  el.textContent = 'Listing trash...'; el.className = '';
  const { status, ok, j } = await api('/messages?labelIds=TRASH&maxResults=50');
  if (!ok) { show(el, 'HTTP ' + status + '\n' + JSON.stringify(j, null, 2), false); return; }
  const msgs = j.messages || [];
  let rows = '<table><tr><th>ID</th><th>Date</th><th>From</th><th>Subject</th><th>Labels</th></tr>';
  for (const m of msgs) {
    const g = await api('/messages/' + m.id + '?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date');
    const h = {};
    (g.j.payload && g.j.payload.headers || []).forEach(x => h[x.name] = x.value);
    const esc = s => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    rows += '<tr><td>' + m.id + '</td><td>' + esc(h.Date) + '</td><td>' + esc(h.From) + '</td><td>' + esc(h.Subject) + '</td><td>' + (g.j.labelIds || []).join(', ') + '</td></tr>';
  }
  rows += '</table>';
  listEl.innerHTML = rows;
  show(el, 'Trash: ' + msgs.length + ' messages listed (headers only).', true);
}
async function modify(id, add, remove, verb) {
  const el = document.getElementById('result');
  if (!tok() || !id) { show(el, 'Need a token and a message ID.', false); return; }
  const { status, ok, j } = await api('/messages/' + id + '/modify', 'POST', { addLabelIds: add, removeLabelIds: remove });
  show(el, verb + ' ' + id + ': HTTP ' + status + '\n' + JSON.stringify(j, null, 2), ok);
}
function fileMsg() { modify(document.getElementById('msgId').value.trim(), [document.getElementById('labelId').value], ['INBOX'], 'Filed'); }
function archiveMsg() { modify(document.getElementById('msgId').value.trim(), [], ['INBOX'], 'Archived'); }
function trashMsg() { modify(document.getElementById('msgId').value.trim(), ['TRASH'], ['INBOX'], 'Trashed'); }
function untrashMsg() { modify(document.getElementById('msgId').value.trim(), ['INBOX'], ['TRASH'], 'Restored'); }
</script>
</body></html>
